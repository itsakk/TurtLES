[backend]
precision = double

[constants]
gamma = 1.4
mu    = {mu}
Pr    = 0.72
M     = 0.2

[solver]
system = navier-stokes
order  = {order}
anti-alias = flux, surf-flux

[solver-time-integrator]
scheme = rk45
controller = pi
atol = 1e-5
rtol = 1e-5
t0 = 0.0  # set by `turtles-gen run trajectory`
dt = 1e-7
tend = 0.0  # set by `turtles-gen run trajectory`

[soln-plugin-nancheck]
nsteps = 1000

[soln-plugin-writer]
dt-out = {trajectory_dt}
basedir = {trajectories_dir}
basename = {simname}_ts{{t:.3f}}
region = box(({box_lo}), ({box_hi}))

[solver-interfaces-line]
flux-pts = gauss-legendre
quad-deg = 11

[solver-interfaces-quad]
flux-pts = gauss-legendre
quad-deg = 11
quad-pts = gauss-legendre

[solver-interfaces-tri]
flux-pts = williams-shunn
quad-deg = 11
quad-pts = williams-shunn

[solver-elements-pri]
soln-pts = williams-shunn~gauss-legendre
quad-deg = 11
quad-pts = williams-shunn~gauss-legendre

[solver-elements-tet]
soln-pts = shunn-ham
quad-deg = 11
quad-pts = shunn-ham

[solver-elements-pyr]
soln-pts = gauss-legendre
quad-deg = 11
quad-pts = gauss-legendre

[solver-elements-hex]
soln-pts = gauss-legendre
quad-deg = 11
quad-pts = gauss-legendre

[solver-interfaces]
riemann-solver = rusanov
ldg-beta       = 0.5
ldg-tau        = 0.1

[soln-bcs-outlet]
type = char-riem-inv
rho = 1
u   = {u}
v   = 0
w   = 0
p   = 1

[soln-bcs-inlet]
type = char-riem-inv
rho = 1
u   = {u}
v   = 0
w   = 0
p   = 1

[soln-bcs-wall]
type = no-slp-adia-wall

[soln-ics]
rho  = 1
u    = {u}
v    = 0 + 0.001*z + 0.01*cos(x)*cos(y)*cos(z)
w    = 0 + 0.001*z + 0.01*cos(x)*cos(y)*cos(z)
p    = 1
