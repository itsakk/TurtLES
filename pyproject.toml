[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turtles"
version = "0.1.0"
description = "TurtLES: a large-scale benchmark for turbulent 3D neural PDE surrogates. Data generation, loading, training and evaluation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Jarno Platenburg" },
  { name = "Armand Kassaï Koupaï" },
]
keywords = ["cfd", "turbulence", "neural-operator", "pde", "benchmark", "dataset"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "h5py>=3.9",
  "hydra-core>=1.3,<2.0",
  "omegaconf>=2.3,<3.0",
  "pyyaml>=6.0",
  "einops>=0.7",
  "huggingface_hub>=0.23",
  "tqdm>=4.65",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
# Fused KNN (flashlib) + Triton decoder kernels used by CALM-PDE and UPT on GPU.
gpu = ["flashlib>=0.4", "triton>=3.0"]
# GINO baseline (thin adapter around the official implementation).
gino = ["neuraloperator>=1.0,<2"]  # the adapter patches 1.x internals
wandb = ["wandb>=0.16"]
# Data generation pipeline (PyFR itself is installed separately, see docs).
generation = ["scipy>=1.10", "pandas>=2.0", "gmsh>=4.11", "pyvista>=0.43"]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff>=0.6", "pre-commit>=3.5"]
all = ["turtles[gpu,gino,wandb,generation,dev]"]

[project.scripts]
turtles-train = "turtles.cli.train:main"
turtles-eval = "turtles.cli.evaluate:main"
turtles-data = "turtles.cli.data:main"
turtles-gen = "turtles.generation.cli:main"

[project.urls]
Dataset = "https://huggingface.co/datasets/turtlesprojectml/turtles"
Homepage = "https://turtlesprojectml-alt.github.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turtles = ["configs/**/*.yaml", "generation/templates/*"]

# ----------------------------------------------------------------------
# Ruff: linter + formatter
# ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["**/._*", "scripts/download_turtles.py"]  # standalone, kept as on the hub

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "N",    # pep8-naming
  "D",    # pydocstyle
]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # function calls in default arguments (common in DL code)
  "N803",    # argument names: tensors are conventionally B, N, C, ...
  "N806",    # variable names: same
  "N812",    # `import torch.nn.functional as F`
  "N817",    # `DistributedDataParallel as DDP`
  "D100",    # module docstrings are encouraged, not enforced
  "D104",    # package docstrings
  "D105",    # magic method docstrings
  "D107",    # __init__ docstrings (documented on the class)
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
  "RUF001", "RUF002", "RUF003",  # math unicode in strings / docstrings / comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "B017"]
"src/turtles/models/calm_pde_kernels.py" = ["N802", "N816", "D"]  # Triton kernel naming
"src/turtles/generation/geometry.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# ----------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["cuda: requires a CUDA device"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
